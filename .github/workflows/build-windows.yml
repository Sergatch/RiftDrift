name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 installers
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check desktop application
        run: npm run check:desktop

      - name: Build NSIS and MSI installers
        run: npm run build:windows

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: RiftDrift-Windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          ) | ForEach-Object { $_.FullName }

          gh release create "$env:RELEASE_TAG" $assets `
            --verify-tag `
            --generate-notes `
            --title "RiftDrift $env:RELEASE_TAG"
